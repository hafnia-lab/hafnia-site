name: Sync public SEO content from Hafnia admin
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hafnia-public-seo
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install thumbnail optimizer
        run: npm ci --no-audit --no-fund
      - name: Refresh crawlable prices and gallery
        run: node sync-public-seo.cjs
      - name: Validate snapshot
        run: |
          node --check sync-public-seo.cjs
          node audit-public-seo.cjs
          git diff --check
      - name: Commit changes only when public content changed
        run: |
          git add index.html tattoo-koebenhavn.html images/thumbs/
          if git diff --cached --quiet; then
            echo 'No public changes'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: refresh public SEO snapshot from admin'
          git push
